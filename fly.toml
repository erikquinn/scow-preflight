# fly.toml app configuration file generated for scow-preflight on 2026-05-08T20:49:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scow-preflight'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  size = 'shared-cpu-1x'
